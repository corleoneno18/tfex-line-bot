name: Run Daily Trading Summary Bots

on:
  schedule:
    # ตั้งเวลาให้รันอัตโนมัติ (ตัวอย่าง: ทุกวันจันทร์ - ศุกร์ เวลา 17:00 น. เวลาไทย = 10:00 UTC)
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # ปุ่มกดรันเองผ่านหน้าเว็บ GitHub Actions

jobs:
  run-bots:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run SET50 Futures Bot (main.py)
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py

      - name: Run Investor Type Bot (investor_type.py)
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python investor_type.py
